<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'auth/style.css'%}">
    <title>Document</title>
</head>

    <body>
        <section>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <h1>Login</h1>
                <h3 style="background-color: rgba(255, 0, 0, 0.3); color:magenta;">{{ error }}</h3>
                <div class="inputbox">
                    <ion-icon name="mail-outline"></ion-icon>
                    <input type="tel" name="phone" required>
                    <label for="">Telefon raqam </label>
                </div>
                <div class="inputbox">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" name="password" required>
                    <label for="">Parolingizni kiriting:</label>
                </div>
                <button type="submit">Log in</button>
                <div class="register">
                    <p>Royhatdan o'tmagansizmi <a href="{% url 'regis' %}">Ro'yxatdan o'tish</a></p>
                </div>
            </form>
        </section>
        <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    </body>

</html>
